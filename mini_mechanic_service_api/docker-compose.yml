services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mechanic_db
      POSTGRES_USER: mechanic_user
      POSTGRES_PASSWORD: mechanic_password
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mechanic_user -d mechanic_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: mechanic_db
      POSTGRES_USER: mechanic_user
      POSTGRES_PASSWORD: mechanic_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "1"
      ALLOWED_HOSTS: "127.0.0.1,localhost,web"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
